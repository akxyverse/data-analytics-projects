<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Data Analytics Projects banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07160d"/>
      <stop offset="45%" stop-color="#0d2e1a"/>
      <stop offset="100%" stop-color="#124a26"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <g fill="#22c55e" opacity="0.08">
    <circle cx="60" cy="40" r="2.2"/><circle cx="100" cy="40" r="2.2"/><circle cx="140" cy="40" r="2.2"/>
    <circle cx="60" cy="70" r="2.2"/><circle cx="100" cy="70" r="2.2"/><circle cx="140" cy="70" r="2.2"/>
  </g>

  <!-- dashboard tile cluster: 4 mini widgets -->
  <g transform="translate(860,55)">
    <!-- widget 1: bar chart tile -->
    <rect x="0" y="0" width="100" height="75" rx="8" fill="#0d3320" stroke="#22c55e" stroke-width="1.5"/>
    <rect x="14" y="45" width="10" height="20" fill="#4ade80"/>
    <rect x="30" y="30" width="10" height="35" fill="#4ade80"/>
    <rect x="46" y="18" width="10" height="47" fill="#86efac"/>
    <rect x="62" y="38" width="10" height="27" fill="#4ade80"/>
    <!-- widget 2: line chart tile -->
    <rect x="112" y="0" width="100" height="75" rx="8" fill="#0d3320" stroke="#4ade80" stroke-width="1.5"/>
    <polyline points="124,55 140,40 156,48 172,25 188,35 200,20" fill="none" stroke="#86efac" stroke-width="2.5"/>
    <!-- widget 3: donut tile -->
    <rect x="0" y="87" width="100" height="75" rx="8" fill="#0d3320" stroke="#4ade80" stroke-width="1.5"/>
    <circle cx="50" cy="124" r="24" fill="none" stroke="#15803d" stroke-width="10"/>
    <circle cx="50" cy="124" r="24" fill="none" stroke="#86efac" stroke-width="10" stroke-dasharray="80 150" stroke-linecap="round"/>
    <!-- widget 4: code bracket tile -->
    <rect x="112" y="87" width="100" height="75" rx="8" fill="#0d3320" stroke="#22c55e" stroke-width="1.5"/>
    <text x="162" y="138" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="34" fill="#86efac">&lt;/&gt;</text>
  </g>

  <text x="150" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#f8fafc">
    DATA ANALYTICS PROJECTS
  </text>
  <rect x="150" y="164" width="150" height="4" rx="2" fill="url(#accent)"/>
  <text x="150" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#bbf7d0">
    Tool-wise &#8226; Domain-wise &#8226; End-to-End &#8226; Showcase
  </text>
  <text x="150" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#86efac">
    Where theory turns into shipped, working dashboards
  </text>

  <text x="1130" y="295" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="14" fill="#5a8a6a">
    github.com/akxyverse
  </text>
</svg>
