  <rect x="150" y="164" width="150" height="4" rx="2" fill="url(#accent)"/>
  <text x="150" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#bbf7d0">
